<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 과정 지도</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--border:rgba(31,30,29,.12);--border-strong:rgba(31,30,29,.22);--border-accent:#378ADD;--bg-accent:#E6F1FB;--text-accent:#185FA5;--surface-1:#F5F4EF;--surface-2:#ffffff;--radius:8px;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--t:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-muted:#888780;--border:rgba(236,235,230,.14);--border-strong:rgba(236,235,230,.26);--bg-accent:#0C447C;--text-accent:#B5D4F4;--surface-1:#262624;--surface-2:#1f1e1d;--t:#b4b2a9}body{background:#191918}}
body{margin:0;padding:16px;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--text-primary);background:var(--surface-2);font-size:16px;line-height:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer}
input[type=range]{accent-color:#534AB7}
svg text{font-family:inherit}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27}.c-amber>.th{fill:#FAEEDA}.c-amber>.ts{fill:#FAC775}
.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}}
.node{cursor:default}
</style>
<script>function sendPrompt(){}</script>
</head><body>
<h2 class="sr-only">딥러닝 학습 과정 0단계부터 8단계까지를 누르면 각 단계의 역할과 지금까지 본 개념을 보여 주는 지도</h2>
<style>
.chip{border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 10px;font-size:13px;background:transparent;color:var(--text-primary);cursor:pointer}
.chip.loop{border-color:var(--border-accent)}
.chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.it{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.6;margin:4px 0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
</style>
<div id="chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px"></div>
<div style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">파란 테두리 2~5단계 = 학습 1스텝(배치마다 반복)</div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px 20px">
<div id="ttl" style="font-size:18px;font-weight:500"></div>
<div id="do" style="font-size:14px;color:var(--text-secondary);margin:4px 0 12px"></div>
<div id="items"></div>
</div>
<div style="display:flex;gap:16px;font-size:13px;color:var(--text-secondary);margin-top:10px"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#D85A30;margin-right:6px"></span>DUST 고유 개념</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-muted);margin-right:6px"></span>일반 개념</span></div>
<script>
const S=[
['0','데이터 준비','문장을 토큰으로 자르고 배치로 묶습니다.',[[0,'FineWeb 데이터, BPE 어휘 4096개'],[0,'배치 16k 토큰 = 시퀀스 2048 토큰 × 8개']]],
['1','모델 정의·초기화','층 구조를 정하고 가중치 W를 난수로 채웁니다.',[[0,'GPT형 트랜스포머, 기본 8층·폭 512'],[0,'선형층 y = Wx, 가중치 W']]],
['2','순전파','입력이 층을 차례로 지나며 활성화값을 만듭니다.',[[0,'활성화 x(층 입력), y(층 출력)'],[1,'섭동: 선형층 출력에 잡음 y → y + σa'],[1,'K개 draw를 한 배치로, clean 순전파 캐시'],[0,'역전파는 여기서 활성화를 VRAM에 쌓아 둠'],[0,'forward gradient는 여기서 접선을 같이 계산']]],
['3','손실 계산','예측과 정답의 차이를 토큰마다 숫자로 만듭니다.',[[0,'토큰별 손실 ℓ_s(교차 엔트로피)'],[1,'점수 c_s = 같은 토큰 draw 평균 손실 − ℓ_s'],[1,'보상 r_t = 뒤 토큰 점수의 할인 합(γ)']]],
['4','신용 할당','각 가중치가 손실에 얼마나 책임 있는지(기울기) 구합니다.',[[0,'역전파: δ를 거꾸로 전달, G = δxᵀ'],[0,'forward gradient: ĝ = (∇L·v)v'],[1,'DUST: ĝ = −(1/Kσ)Σ r·a, Ĝ = ĝxᵀ'],[0,'0차 정보(손실 값) vs 1차 정보(미분)']]],
['5','가중치 갱신','기울기 반대 방향으로 가중치를 옮깁니다.',[[0,'경사하강법 W ← W − ηG'],[0,'SGD+모멘텀, Adam, 학습률 η'],[0,'G가 어디서 왔는지는 이 단계와 무관']]],
['6','반복','2~5단계를 배치마다 되풀이합니다.',[[0,'스텝, 에폭(DUST 실험은 1 에폭)'],[0,'토큰 예산 10만~2천만']]],
['7','평가','학습에 안 쓴 데이터로 성능을 잽니다.',[[0,'검증 손실로 체크포인트 선택'],[0,'테스트 손실: DUST vs 역전파 vs EGGROLL'],[1,'역전파 기울기와의 코사인 비교']]],
['8','추론','학습이 끝난 모델로 새 입력을 처리합니다.',[[0,'순전파만 사용'],[0,'DUST·역전파 모두 관여하지 않음']]]
];
const ch=document.getElementById('chips');
S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='chip'+(i>=2&&i<=5?' loop':'');b.textContent=s[0]+'. '+s[1];b.onclick=()=>show(i);ch.appendChild(b);});
function show(i){
[...ch.children].forEach((b,j)=>b.classList.toggle('on',i===j));
const s=S[i];document.getElementById('ttl').textContent=s[0]+'. '+s[1];
document.getElementById('do').textContent=s[2];
document.getElementById('items').innerHTML=s[3].map(x=>'<div class="it"><span class="dot" style="background:'+(x[0]?'#D85A30':'var(--text-muted)')+'"></span><span>'+x[1]+'</span></div>').join('');
}
show(2);
</script>

</body></html>
