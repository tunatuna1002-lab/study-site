<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUST의 위치</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--border:rgba(31,30,29,.12);--border-strong:rgba(31,30,29,.22);--border-accent:#378ADD;--bg-accent:#E6F1FB;--text-accent:#185FA5;--surface-1:#F5F4EF;--surface-2:#ffffff;--radius:8px;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--t:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-muted:#888780;--border:rgba(236,235,230,.14);--border-strong:rgba(236,235,230,.26);--bg-accent:#0C447C;--text-accent:#B5D4F4;--surface-1:#262624;--surface-2:#1f1e1d;--t:#b4b2a9}body{background:#191918}}
body{margin:0;padding:16px;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--text-primary);background:var(--surface-2);font-size:16px;line-height:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer}
input[type=range]{accent-color:#534AB7}
svg text{font-family:inherit}
.t{font-size:14px;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27}.c-amber>.th{fill:#FAEEDA}.c-amber>.ts{fill:#FAC775}
.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}}
.node{cursor:default}
</style>
<script>function sendPrompt(){}</script>
</head><body>
<svg width="100%" viewBox="0 0 680 400" role="img"><title>학습 파이프라인과 신용 할당 방법</title><desc>순전파, 손실 계산, 기울기 구하기, 가중치 갱신의 네 단계 중 기울기 구하기 칸에 들어가는 방법을 1차 정보와 0차 정보로 나눈 구조. DUST는 0차 정보의 활성화 섭동에 속한다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect class="box" x="50" y="40" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="58" text-anchor="middle" dominant-baseline="central">순전파</text><text class="ts" x="115" y="78" text-anchor="middle" dominant-baseline="central">입력 → 출력</text></g><g><rect class="box" x="200" y="40" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="265" y="58" text-anchor="middle" dominant-baseline="central">손실 계산</text><text class="ts" x="265" y="78" text-anchor="middle" dominant-baseline="central">얼마나 틀렸나</text></g><g class="c-purple"><rect x="350" y="40" width="130" height="56" rx="8" stroke-width="1"/><text class="th" x="415" y="58" text-anchor="middle" dominant-baseline="central">기울기 구하기</text><text class="ts" x="415" y="78" text-anchor="middle" dominant-baseline="central">신용 할당</text></g><g><rect class="box" x="500" y="40" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">가중치 갱신</text><text class="ts" x="565" y="78" text-anchor="middle" dominant-baseline="central">경사하강법·Adam</text></g><line x1="180" y1="68" x2="198" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="68" x2="348" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="68" x2="498" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="96" x2="415" y2="136" class="arr" marker-end="url(#arrow)"/><rect x="50" y="138" width="580" height="212" rx="12" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="190" y="166" text-anchor="middle">미분을 쓴다 (1차 정보)</text><text class="th" x="490" y="166" text-anchor="middle">손실 값만 쓴다 (0차 정보)</text><g><rect class="box" x="70" y="186" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="204" text-anchor="middle" dominant-baseline="central">역전파</text><text class="ts" x="190" y="224" text-anchor="middle" dominant-baseline="central">연쇄 법칙, 정확값</text></g><g><rect class="box" x="70" y="262" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="280" text-anchor="middle" dominant-baseline="central">Forward gradient</text><text class="ts" x="190" y="300" text-anchor="middle" dominant-baseline="central">순방향 미분, 추정값</text></g><g><rect class="box" x="370" y="186" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="490" y="204" text-anchor="middle" dominant-baseline="central">가중치 섭동</text><text class="ts" x="490" y="224" text-anchor="middle" dominant-baseline="central">ES · EGGROLL · MeZO</text></g><g class="c-coral"><rect x="370" y="262" width="240" height="56" rx="8" stroke-width="1.5"/><text class="th" x="490" y="280" text-anchor="middle" dominant-baseline="central">활성화 섭동</text><text class="ts" x="490" y="300" text-anchor="middle" dominant-baseline="central">노드 섭동 → DUST</text></g><text class="ts" x="340" y="380" text-anchor="middle">보라 = DUST가 바꾸는 칸 · 주황 = DUST가 속한 계열 · 나머지 칸은 그대로</text></svg>

</body></html>
